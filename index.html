<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRG Kicks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        header {
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav a {
            text-decoration: none;
            color: #111;
            margin-left: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            background: #f3f3f3;
        }

        .hero h1 {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .hero p {
            margin-top: 15px;
            font-size: 15px;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #111;
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .products {
            padding: 50px 20px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product {
            background: #f5f5f5;
            padding-bottom: 15px;
        }

        .product-image {
            height: 220px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 13px;
        }

        .product h3 {
            font-size: 15px;
            margin: 12px 10px 5px;
        }

        .product p {
            margin-left: 10px;
            font-weight: bold;
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CRG KICKS</div>

    <nav>
        <a href="#shop">SHOP</a>
        <a href="#contact">CONTACT</a>
    </nav>
</header>

<section class="hero">
    <h1>CRG KICKS</h1>
    <p>STREETWEAR • SNEAKERS • CULTURE</p>

    <a href="#shop" class="button">SHOP NOW</a>
</section>

<section class="products" id="shop">
    <h2>FEATURED</h2>

    <div class="product-grid">

        <div class="product">
            <div class="product-image">
                PRODUCT IMAGE
            </div>
            <h3>Coming Soon</h3>
            <p>S/ 000</p>
        </div>

        <div class="product">
            <div class="product-image">
                PRODUCT IMAGE
            </div>
            <h3>Coming Soon</h3>
            <p>S/ 000</p>
        </div>

    </div>
</section>

<footer id="contact">
    CRG KICKS © 2026
</footer>

</body>
</html>
